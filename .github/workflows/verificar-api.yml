name: Verificar API da campanha

on:
  push:
    paths:
      - ".github/workflows/verificar-api.yml"
      - "supabase/functions/**"
      - "index.html"
      - "admin.html"
      - "js/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Consultar vitrine pública
        shell: bash
        run: |
          curl -fsS --retry 2 --max-time 20 \
            "https://wsixoeonopxejapfxjms.supabase.co/functions/v1/campanha-publica" \
            -o resposta.json
          jq -e '.perfis | type == "array"' resposta.json
      - name: Verificar configuração do Turnstile sem enviar dados
        shell: bash
        run: |
          status=$(curl -sS -o resposta-captcha.json -w "%{http_code}" --max-time 20 \
            -X POST -H "Origin: https://mateuscrlopes.github.io" \
            -H "Content-Type: text/plain" --data "verificacao-sem-dados" \
            "https://wsixoeonopxejapfxjms.supabase.co/functions/v1/campanha-publica")
          if [ "$status" = "415" ]; then
            echo "Turnstile secret configurado no servidor."
          elif [ "$status" = "503" ]; then
            echo "::warning::Turnstile secret ainda não configurado no Supabase."
          else
            echo "::warning::Resposta inesperada na verificação: HTTP $status."
          fi
      - name: Bloquear solicitação sem token Turnstile
        shell: bash
        run: |
          status=$(curl -sS -o resposta-sem-captcha.json -w "%{http_code}" --max-time 20 \
            -X POST -H "Origin: https://mateuscrlopes.github.io" \
            -H "Content-Type: application/json" \
            --data '{"acao":"solicitar","crianca_id":"00000000-0000-4000-8000-000000000000","nome":"Teste Automatico","telefone":"11999990000","email":"","autorizou_contato":true,"website":"","turnstile_token":""}' \
            "https://wsixoeonopxejapfxjms.supabase.co/functions/v1/campanha-publica")
          echo "Envio sem Turnstile: HTTP $status (esperado 403)"
          test "$status" = "403"
      - name: Garantir bloqueio da gestão sem login
        shell: bash
        run: |
          status=$(curl -sS -o resposta-admin.json -w "%{http_code}" --max-time 20 \
            "https://wsixoeonopxejapfxjms.supabase.co/functions/v1/campanha-admin")
          echo "Status não autenticado: $status"
          test "$status" = "401"
      - name: Verificar biblioteca de login da gestão
        shell: bash
        run: |
          curl -fsSL --max-time 20 \
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js" \
            -o supabase.min.js
          test -s supabase.min.js

      - name: Baixar arquivos do site
        uses: actions/checkout@v4
      - name: Verificar sintaxe dos scripts das páginas
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for name in ('index.html', 'admin.html'):
              source = Path(name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?![^>]*\bsrc\b)[^>]*>(.*?)</script>', source, flags=re.S|re.I)
              if len(scripts)!=1:
                  raise SystemExit(f'Esperado 1 script inline em {name}, encontrado {len(scripts)}')
              Path('/tmp/'+name+'.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/admin.html.js
          node --check js/config.js
